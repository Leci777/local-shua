name: Build Android APK

# Cloud build for the Flutter APK.
# Background: on the local machine the Dart runtime cannot create named pipes
# (CreateFile failed 231) due to a system policy restriction. The Dart compiler
# (frontend_server) requires bidirectional pipe communication, so local builds
# are impossible. The Linux runner here has no such restriction.
on:
  push:
    branches: [ main, master, cloud-build ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      # Collect every compiler error into one file so it is readable in a single
      # place, no matter how many separate compile passes fail.
      - name: Collect Dart compile errors (fast, no Gradle)
        working-directory: app
        run: |
          set +e
          echo "### flutter analyze"
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          echo ""
          echo "### flutter build bundle --release (AOT kernel compile)"
          flutter build bundle --release 2>&1 | tee bundle.log
          echo ""
          echo "### COMPILE ERRORS (dart file:line:col)"
          {
            grep -hE "\.dart:[0-9]+:[0-9]+:" analyze.log bundle.log 2>/dev/null
          } | sort -u | head -60
          echo ""
          echo "### DONE"

      - name: Build APK (arm64 first, OnePlus Ace 6 is arm64)
        working-directory: app
        run: |
          set +e
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi 2>&1 | tee build-arm64.log
          echo "### APK BUILD EXIT: ${PIPESTATUS[0]}"
          echo "### DART ERRORS"
          grep -hE "\.dart:[0-9]+:[0-9]+:" build-arm64.log 2>/dev/null | sort -u | head -40
          echo "### LAST 60 LINES"
          tail -60 build-arm64.log

      - name: Build universal APK
        working-directory: app
        run: flutter build apk --release 2>&1 | tee build-universal.log || true

      # Always ship the logs, so a failed run is diagnosable without screenshots.
      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/analyze.log
            app/bundle.log
            app/build-arm64.log
            app/build-universal.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-shua-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: ignore
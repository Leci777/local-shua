name: Build Android APK

# Cloud build for the Flutter APK.
# Background: on the local machine, the Dart runtime cannot create named pipes
# (CreateFile failed 231) due to a system policy restriction. The Dart compiler
# (frontend_server) requires bidirectional pipe communication, so local builds
# are impossible. The Linux runner here has no such restriction.
on:
  push:
    branches: [ main, master, cloud-build ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      # Print analyze output into the build log. Dart compile errors show up here
      # first, so we do not waste 10 minutes on a build that will fail anyway.
      - name: Analyze
        working-directory: app
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          echo "=====ERRORS AND WARNINGS====="
          grep -E "(error|warning) •" analyze.log | head -60 || true
          echo "=====ANALYZE FULL OUTPUT====="
          cat analyze.log
          exit 0

      - name: Build APK (arm64 first, OnePlus Ace 6 is arm64)
        working-directory: app
        run: |
          set +e
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi 2>&1 | tee build-arm64.log
          code=${PIPESTATUS[0]}
          echo "=====BUILD FULL OUTPUT====="
          cat build-arm64.log
          exit $code

      - name: Build universal APK (compatible with all Android devices)
        working-directory: app
        if: always()
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-shua-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error
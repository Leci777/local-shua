name: Build Android APK

# Cloud build for the Flutter APK.
# Background: on the local machine the Dart runtime cannot create named pipes
# (CreateFile failed 231) due to a system policy restriction. The Dart compiler
# (frontend_server) requires bidirectional pipe communication, so local builds
# are impossible. The Linux runner here has no such restriction.
on:
  push:
    branches: [ main, master, cloud-build ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      # local.properties is gitignored (it holds machine-local paths), but the
      # Gradle settings file reads flutter.sdk from it and fails without it.
      - name: Write local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > app/android/local.properties
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" >> app/android/local.properties
          cat app/android/local.properties

      # Compile the Dart kernel first. This step needs no Gradle and no NDK, so
      # it fails in ~1 minute and points straight at Dart source errors.
      # A release-mode bundle is required: some errors (a `const <int>{}`
      # initializer, for example) only appear in the AOT pass, not in JIT.
      - name: Compile Dart kernel (fast failure, no Gradle)
        working-directory: app
        run: |
          set -o pipefail
          flutter build bundle --release 2>&1 | tee bundle.log

      # Build the universal APK. No `set +e` here: a real failure must fail the
      # job, otherwise a green check mark can hide "no APK produced".
      - name: Build universal APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-universal.log

      - name: Build arm64 APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi 2>&1 | tee build-arm64.log

      # Ship the logs whatever happened. When the build fails, the log artifact
      # is the only place the real error is visible.
      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/bundle.log
            app/build-universal.log
            app/build-arm64.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-shua-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          # error, not ignore: never report success without an APK
          if-no-files-found: error
name: local_shua
description: 本地刷 - 手机刷电脑文件夹里的视频
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（架构 §3.3：不用 code-gen，不引 build_runner）
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 播放内核（架构 §4.2：libmpv，格式兼容最全）
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.1.11
  media_kit_video: ^1.1.11

  # 前台服务 + 锁屏媒体通知（架构 §3.6）
  audio_service: ^0.18.15

  # 网络 + Range 下载（架构 §3.8）
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4

  # 权限（POST_NOTIFICATIONS 等运行时申请）
  permission_handler: ^11.3.1

  # 165Hz 高刷请求（W5-01）
  flutter_displaymode: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

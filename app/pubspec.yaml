name: local_shua
description: 本地刷 - 手机刷电脑文件夹里的视频
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（架构 §3.3：不用 code-gen，不引 build_runner）
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 播放内核：系统播放器（Android 走 ExoPlayer 原生解码）
  # 原来用 media_kit(libmpv) 格式兼容更全，但它的原生库要从 GitHub 下载，
  # 国内网络不稳会导致构建失败（而且每次多等好几分钟）。
  # 你的视频主要是 h264+aac，系统播放器完全支持；少量 hevc 一加 Ace 6 也能硬解。
  video_player: ^2.10.0

  # 网络 + Range 下载（架构 §3.8）
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

# 注：本分支（cloud-build）用于云端编译，已移除 master 分支上的 dependency_overrides
# 环境适配（那是为了绕开本机 dart 命名管道被系统限制的问题）。
#
# 以下能力因本机环境限制暂时移除，换到正常编译环境后按需加回：
#   audio_service ^0.18.19     → 锁屏/后台继续播放（PRD F-11）
#   permission_handler ^11.3.1 → 通知权限运行时申请（配合 audio_service）
#   flutter_displaymode ^0.6.0 → 165Hz 高刷请求（当前跟随系统刷新率）

flutter:
  uses-material-design: true
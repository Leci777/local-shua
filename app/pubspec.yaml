name: local_shua
description: 本地刷 - 手机刷电脑文件夹里的视频
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（架构 §3.3：不用 code-gen，不引 build_runner）
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 播放内核（架构 §4.2：libmpv，格式兼容最全）
  # 注意版本线：media_kit 本体 1.x，libs_video 是独立的 1.0.x，两者不同步升
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^1.3.1

  # 网络 + Range 下载（架构 §3.8）
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

# ===== 环境适配（可整段删除，换到正常编译机器时）=====
# 背景：本机 dart 的命名管道创建被系统拦截（CreateFile failed 231），
# 导致 flutter_tools 调起 pub 时丢失「运行在 flutter 上下文中」的身份，
# pub 便拒绝一切 `sdk: flutter` 依赖（dart.dev 明确说明该语法需要这条前提）。
#
# 现状：直接写 path 只能救回 SDK 自身的包，第三方插件内部仍用 `sdk: flutter`，
# 依然被拒。彻底解法是让 pub 在这些包解析时看到 SDK 身份——
# 见 docs/ENV.md 记录的排查过程与后续方案。
dependency_overrides:
  # ===== Flutter SDK 自带包 =====
  flutter:
    path: D:/flutter/packages/flutter
  flutter_web_plugins:
    path: D:/flutter/packages/flutter_web_plugins
  flutter_localizations:
    path: D:/flutter/packages/flutter_localizations
  sky_engine:
    path: D:/flutter/bin/cache/pkg/sky_engine
  flutter_gpu:
    path: D:/flutter/bin/cache/pkg/flutter_gpu

  # ===== 第三方包本地副本（见 vendor/）=====
  archive:
    path: vendor/archive
  args:
    path: vendor/args
  async:
    path: vendor/async
  boolean_selector:
    path: vendor/boolean_selector
  clock:
